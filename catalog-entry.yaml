name: Transaction Foundation Model — Live Fraud Inference
entries:
  - title: Transaction Foundation Model — Live Fraud Inference
    label: tfm-fraud-inference
    short_description: |
      Deploy a live fraud-inference cockpit for the NVIDIA Transaction Foundation Model on Cloudera AI. Compose card transactions from TabFormer features, run GPU-accelerated inference through the decoder foundation model and XGBoost heads, and compare raw tabular features vs. foundation-model embeddings with held-out AUC/AP lift and a live UMAP map.
